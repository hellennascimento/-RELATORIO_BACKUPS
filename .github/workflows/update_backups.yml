name: Atualização Automática de Backups

on:
  schedule:
    # Roda a cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch:
    # Permite rodar manualmente pelo painel do GitHub se necessário

permissions:
  contents: write

# Impede duas execuções simultâneas
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
    - name: Obter o código do repositório
      uses: actions/checkout@v5

    - name: Configurar o Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Executar script de coleta
      env:
        ACRONIS_CLIENT_ID: ${{ secrets.ACRONIS_CLIENT_ID }}
        ACRONIS_CLIENT_SECRET: ${{ secrets.ACRONIS_CLIENT_SECRET }}
        ACRONIS_DATACENTER_URL: ${{ secrets.ACRONIS_DATACENTER_URL }}
        TZ: America/Sao_Paulo
      run: python monitor_acronis.py

    - name: Salvar e Publicar alterações
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add index.html
        # Evita erro se não houver modificações nos arquivos
        git diff-index --quiet HEAD || git commit -m "Atualização automática de dados [skip ci]"
        # Tenta enviar até 3 vezes, sincronizando com o remoto antes de cada tentativa
        for i in 1 2 3; do
          git pull --rebase -X theirs origin main && git push && exit 0
          echo "Push falhou (tentativa $i), aguardando para tentar novamente..."
          sleep 15
        done
        exit 1
