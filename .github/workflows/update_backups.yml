name: Atualização Automática de Backups

on:
  schedule:
    # Roda a cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch:
    # Permite rodar manualmente pelo painel do GitHub se necessário

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
    - name: Obter o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Executar script de coleta
      env:
        ACRONIS_CLIENT_ID: ${{ secrets.ACRONIS_CLIENT_ID }}
        ACRONIS_CLIENT_SECRET: ${{ secrets.ACRONIS_CLIENT_SECRET }}
        ACRONIS_DATACENTER_URL: ${{ secrets.ACRONIS_DATACENTER_URL }}
        TZ: America/Sao_Paulo
      run: python monitor_acronis.py

    - name: Salvar e Publicar alterações
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add index.html
        # Evita erro se não houver modificações nos arquivos
        git diff-index --quiet HEAD || git commit -m "Atualização automática de dados [skip ci]"
        git push
